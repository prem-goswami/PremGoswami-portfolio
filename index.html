  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-width:0\">\n        <h3 style=\"font-family:var(--sans);font-weight:600;font-size:clamp(1.35rem,2.4vw,2rem);line-height:1.2\">Software Engineer<\u002Fh3>\n        <p style=\"margin:.7rem 0 1.7rem;color:#2b2823;font-family:var(--sans);font-weight:600;font-size:clamp(.98rem,1.35vw,1.12rem);letter-spacing:.01em;line-height:1.4\">Broadridge Financial Solutions (via OSI Digital) · Jul 2022 to Sep 2023<\u002Fp>\n        <ul style=\"list-style:none;display:grid;gap:1rem;max-width:72ch\">\n          <li style=\"padding-left:1.7rem;position:relative;color:#3c382f\"><span style=\"position:absolute;left:0;color:var(--acc)\">→<\u002Fspan>Architected <b style=\"color:var(--ink)\">20+ mission-critical REST APIs<\u002Fb> (Node.js, Express, PostgreSQL) for high-volume financial data, boosting backend throughput <b style=\"color:var(--ink)\">35%<\u002Fb> under peak load.<\u002Fli>\n          <li style=\"padding-left:1.7rem;position:relative;color:#3c382f\"><span style=\"position:absolute;left:0;color:var(--acc)\">→<\u002Fspan>Optimized PostgreSQL schemas and data-access layers, cutting query response times <b style=\"color:var(--ink)\">25%<\u002Fb> under high concurrency via indexing and query tuning.<\u002Fli>\n          <li style=\"padding-left:1.7rem;position:relative;color:#3c382f\"><span style=\"position:absolute;left:0;color:var(--acc)\">→<\u002Fspan>Hardened security with <b style=\"color:var(--ink)\">role-based access control<\u002Fb> across AWS S3 and RDS, meeting financial-industry compliance standards.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <article data-xp=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:clamp(1.2rem,3vw,3rem);padding:3.6rem 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);align-items:start;opacity:0;transform:translateY(30px)\" data-reveal=\"\">\n      <div aria-hidden=\"true\" data-xp-year=\"\" style=\"position:sticky;top:110px;font-family:var(--serif);font-size:clamp(2rem,3.6vw,3.2rem);color:var(--acc);line-height:1;max-width:200px\">2019—<\u002Fdiv>\n      <div data-xp-body=\"\" style=\"grid-column:span 3;min-width:0\">\n        <h3 style=\"font-family:var(--sans);font-weight:600;font-size:clamp(1.35rem,2.4vw,2rem);line-height:1.2\">Staff Engineer<\u002Fh3>\n        <p style=\"margin:.7rem 0 1.7rem;color:#2b2823;font-family:var(--sans);font-weight:600;font-size:clamp(.98rem,1.35vw,1.12rem);letter-spacing:.01em;line-height:1.4\">Mobigesture · Jan 2019 to Jun 2022<\u002Fp>\n        <ul style=\"list-style:none;display:grid;gap:1rem;max-width:72ch\">\n          <li style=\"padding-left:1.7rem;position:relative;color:#3c382f\"><span style=\"position:absolute;left:0;color:var(--acc)\">→<\u002Fspan>Owned <b style=\"color:var(--ink)\">document-exchange platform architecture<\u002Fb> end to end, scaling it from <b style=\"color:var(--ink)\">1K to 30K MAU<\u002Fb> through service boundaries, API contracts, and weekly shipping cycles.<\u002Fli>\n          <li style=\"padding-left:1.7rem;position:relative;color:#3c382f\"><span style=\"position:absolute;left:0;color:var(--acc)\">→<\u002Fspan>Established engineering standards (code review, TypeScript, testing) and <b style=\"color:var(--ink)\">mentored 3 junior engineers<\u002Fb>, accelerating onboarding <b style=\"color:var(--ink)\">50%<\u002Fb>.<\u002Fli>\n          <li style=\"padding-left:1.7rem;position:relative;color:#3c382f\"><span style=\"position:absolute;left:0;color:var(--acc)\">→<\u002Fspan>Built a modular, reusable <b style=\"color:var(--ink)\">React component library<\u002Fb> that cut frontend delivery timelines <b style=\"color:var(--ink)\">20%<\u002Fb> across projects.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Farticle>\n  <\u002Fsection>\n\n  <section id=\"work\" aria-label=\"Featured projects\" style=\"border-top:1px solid var(--rule);background:var(--paper2);position:relative\"><span aria-hidden=\"true\" data-rule=\"\" style=\"position:absolute;top:-1px;left:0;right:0;height:2px;background:var(--acc);transform:scaleX(0);transform-origin:0 50%\"><b style=\"position:absolute;right:0;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--acc)\"><\u002Fb><\u002Fspan>\n    <div style=\"padding:14vh 4vw 6vh\">\n      <span style=\"font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);display:inline-flex;align-items:center;gap:.7rem;opacity:0;transform:translateY(30px)\" data-reveal=\"\"><span style=\"width:2.4rem;height:1px;background:var(--acc)\"><\u002Fspan>Featured Work<\u002Fspan>\n      <h2 style=\"font-family:var(--serif);font-weight:400;line-height:.95;font-size:clamp(2.9rem,8vw,7rem);letter-spacing:-.02em;margin-top:1.2rem\" data-split=\"\">Case <em style=\"color:var(--acc)\">studies<\u002Fem><\u002Fh2>\n      <p style=\"color:var(--muted);max-width:52ch;margin-top:1.4rem;opacity:0;transform:translateY(30px)\" data-reveal=\"\">Drag the cards or use the slider below. AI systems first, product work after.<\u002Fp>\n    <\u002Fdiv>\n\n    <div data-rail-wrap=\"\" style=\"overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;cursor:grab\">\n      <div data-rail=\"\" style=\"display:flex;gap:3vw;padding:0 4vw 6vh;width:max-content\">\n\n        <article data-panel=\"\" data-view=\"\" data-glow-host=\"\" data-tilt=\"\" style=\"position:relative;overflow:hidden;flex:0 0 auto;width:min(600px,84vw);background:var(--paper);border:1px solid var(--rule);border-top:3px solid var(--acc);padding:2.6rem;display:flex;flex-direction:column;gap:1.3rem;opacity:0;transform:translateY(50px);box-shadow:0 30px 60px -50px rgba(21,19,15,.6)\">\n          <div data-glow=\"\" style=\"position:absolute;inset:0;opacity:0;pointer-events:none\"><\u002Fdiv><span data-sheen=\"\" aria-hidden=\"true\" style=\"position:absolute;top:0;bottom:0;width:55%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.8),transparent);pointer-events:none;transform:translateX(-130%) skewX(-18deg)\"><\u002Fspan>\n          <span aria-hidden=\"true\" style=\"position:absolute;top:1rem;right:1.6rem;font-family:var(--serif);font-size:4.4rem;line-height:1;color:var(--rule)\">01<\u002Fspan>\n          <span style=\"font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc)\">AI Agents / Security<\u002Fspan>\n          <h3 style=\"font-family:var(--serif);font-weight:400;font-size:clamp(1.9rem,3vw,2.7rem);line-height:1.02;max-width:14ch\">SQL Agent<\u002Fh3>\n          <dl style=\"display:grid;gap:1.1rem;margin:0\">\n            <div><dt style=\"font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem\">Problem<\u002Fdt><dd style=\"margin:0;color:#403c33;font-size:.97rem\">Most text-to-SQL demos hand an LLM a database connection and hope. But the model's output is attacker-influenceable through the user's question, and prompt injection cannot be fixed at the prompt layer, because that layer is exactly what's compromised.<\u002Fdd><\u002Fdiv>\n            <div><dt style=\"font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem\">What I built<\u002Fdt><dd style=\"margin:0;color:#403c33;font-size:.97rem\">A natural-language querying agent (FastAPI, GPT-4o-mini, PostgreSQL) with defense in <b style=\"color:var(--ink)\">five independent layers<\u002Fb>: a deterministic <b style=\"color:var(--ink)\">sqlparse validator<\u002Fb> that enforces exactly one statement and SELECT-only over parsed token types, a read-only role with SELECT grants alone, session-level read-only, a 10s statement timeout, and tamper-isolated audit logging the agent role cannot touch.<\u002Fdd><\u002Fdiv>\n            <div><dt style=\"font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem\">Outcome<\u002Fdt><dd style=\"margin:0;color:#403c33;font-size:.97rem\">Validated by an <b style=\"color:var(--ink)\">18-case test suite<\u002Fb>. It kills stacked queries (<span style=\"font-family:var(--mono);font-size:.82em;color:var(--acc)\">SELECT …; DROP TABLE …;<\u002Fspan>) while correctly passing <span style=\"font-family:var(--mono);font-size:.82em;color:var(--acc)\">WHERE name = 'DROP TABLE'<\u002Fspan>, because parsing beats blacklisting. Every response returns the generated SQL, since an agent that returns only prose is unverifiable.<\u002Fdd><\u002Fdiv>\n          <\u002Fdl>\n          <div style=\"display:flex;flex-wrap:wrap;gap:.5rem\">\n            <span style=\"font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--rule);border-radius:99px;padding:.4rem .8rem\">Python<\u002Fspan><span style=\"font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--rule);border-radius:99px;padding:.4rem .8rem\">FastAPI<\u002Fspan><span style=\"font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--rule);border-radius:99px;padding:.4rem .8rem\">OpenAI<\u002Fspan><span style=\"font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--rule);border-radius:99px;padding:.4rem .8rem\">PostgreSQL<\u002Fspan><span style=\"font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--rule);border-radius:99px;padding:.4rem .8rem\">Docker<\u002Fspan><span style=\"font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--rule);border-radius:99px;padding:.4rem .8rem\">sqlparse<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:auto;display:flex;gap:1.6rem;padding-top:1.3rem;border-top:1px solid var(--rule);font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase\">\n            <a href=\"https://github.com/prem-goswami/SQL-agent\" target=\"_blank\" rel=\"noopener\">Code ↗<\u002Fa><a href=\"https://sql-agent-production-a225.up.railway.app/docs\" target=\"_blank\" rel=\"noopener\">Live Demo ↗<\u002Fa>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <article data-panel=\"\" data-view=\"\" data-glow-host=\"\" data-tilt=\"\" style=\"position:relative;overflow:hidden;flex:0 0 auto;width:min(600px,84vw);background:var(--paper);border:1px solid var(--rule);border-top:3px solid var(--acc);padding:2.6rem;display:flex;flex-direction:column;gap:1.3rem;opacity:0;transform:translateY(50px);box-shadow:0 30px 60px -50px rgba(21,19,15,.6)\">\n          <div data-glow=\"\" style=\"position:absolute;inset:0;opacity:0;pointer-events:none\"><\u002Fdiv><span data-sheen=\"\" aria-hidden=\"true\" style=\"position:absolute;top:0;bottom:0;width:55%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.8),transparent);pointer-events:none;transform:translateX(-130%) skewX(-18deg)\"><\u002Fspan>\n          <span aria-hidden=\"true\" style=\"position:absolute;top:1rem;right:1.6rem;font-family:var(--serif);font-size:4.4rem;line-height:1;color:var(--rule)\">02<\u002Fspan>\n          <span style=\"font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc)\">AI Agents / Orchestration<\u002Fspan>\n          <h3 style=\"font-family:var(--serif);font-weight:400;font-size:clamp(1.9rem,3vw,2.7rem);line-height:1.02;max-width:14ch\">Multi-Source Research Agent<\u002Fh3>\n          <dl style=\"display:grid;gap:1.1rem;margin:0\">\n            <div><dt style=\"font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem\">Problem<\u002Fdt><dd style=\"margin:0;color:#403c33;font-size:.97rem\">Research agents that retrieve once and generate will confidently answer from insufficient evidence. Someone has to judge whether the sources actually answer the question.<\u002Fdd><\u002Fdiv>\n            <div><dt style=\"font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem\">What I built<\u002Fdt><dd style=\"margin:0;color:#403c33;font-size:.97rem\">A <b style=\"color:var(--ink)\">6-node LangGraph agent<\u002Fb> fanning out concurrent web and RAG retrieval, then fusing both result sets. A <b style=\"color:var(--ink)\">critic node<\u002Fb> judges evidence sufficiency, names the specific gap, and feeds it back into retrieval on a <b style=\"color:var(--ink)\">bounded two-correction budget<\u002Fb>. Exhausting that budget degrades the answer rather than throwing. The model writes the prose; code asserts the source lists and confidence from graph state.<\u002Fdd><\u002Fdiv>\n            <div><dt style=\"font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem\">Outcome<\u002Fdt><dd style=\"margin:0;color:#403c33;font-size:.97rem\">Reciprocal Rank Fusion cut a whole class of question from three corrections to one, a <b style=\"color:var(--ink)\">26% latency reduction<\u002Fb> versus 15% from parallelism alone. The lesson: fixing <em>why<\u002Fem> work repeats beats parallelizing the repeated work.<\u002Fdd><\u002Fdiv>\n          <\u002Fdl>\n          <div style=\"display:flex;flex-wrap:wrap;gap:.5rem\">\n            <span style=\"font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--rule);border-radius:99px;padding:.4rem .8rem\">LangGraph<\u002Fspan><span style=\"font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--rule);border-radius:99px;padding:.4rem .8rem\">FastAPI<\u002Fspan><span style=\"font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--rule);border-radius:99px;padding:.4rem .8rem\">Python<\u002Fspan><span style=\"font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--rule);border-radius:99px;padding:.4rem .8rem\">Tavily<\u002Fspan><span style=\"font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--rule);border-radius:99px;padding:.4rem .8rem\">RRF<\u002Fspan><span style=\"font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--rule);border-radius:99px;padding:.4rem .8rem\">Docker<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:auto;display:flex;gap:1.6rem;padding-top:1.3rem;border-top:1px solid var(--rule);font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase\">\n            <a href=\"https://github.com/prem-goswami/langgraph_research_agent\" target=\"_blank\" rel=\"noopener\">Code ↗<\u002Fa><a href=\"https://langgraphreaserchagent-production.up.railway.app/docs\" target=\"_blank\" rel=\"noopener\">Live Demo ↗<\u002Fa>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <article data-panel=\"\" data-view=\"\" data-glow-host=\"\" data-tilt=\"\" style=\"position:relative;overflow:hidden;flex:0 0 auto;width:min(600px,84vw);background:var(--paper);border:1px solid var(--rule);border-top:3px solid var(--acc);padding:2.6rem;display:flex;flex-direction:column;gap:1.3rem;opacity:0;transform:translateY(50px);box-shadow:0 30px 60px -50px rgba(21,19,15,.6)\">\n          <div data-glow=\"\" style=\"position:absolute;inset:0;opacity:0;pointer-events:none\"><\u002Fdiv><span data-sheen=\"\" aria-hidden=\"true\" style=\"position:absolute;top:0;bottom:0;width:55%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.8),transparent);pointer-events:none;transform:translateX(-130%) skewX(-18deg)\"><\u002Fspan>\n          <span aria-hidden=\"true\" style=\"position:absolute;top:1rem;right:1.6rem;font-family:var(--serif);font-size:4.4rem;line-height:1;color:var(--rule)\">03<\u002Fspan>
